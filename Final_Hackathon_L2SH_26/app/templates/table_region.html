{% extends "base.html" %}
{% block title %}Таблица{% endblock %}
{% block content %}
<section class="section">
    <div class="section-head">
        <div>
            <p class="eyebrow">Данные</p>
            <h1>Статистика по регионам</h1>
        </div>
        <a class="button secondary" href="{{ url_for('stats.export_csv') }}">Участников</a>
        <a class="button secondary" href="{{ url_for('stats.export_csv') }}">Призёров</a>
        <a class="button secondary" href="{{ url_for('stats.export_csv') }}">Победителей</a>
        <a class="button secondary" href="{{ url_for('stats.export_csv') }}">Дипломов</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Место</th>
                    <th>Название</th>
                    <th>Параметр</th>
                    <!-- <th>Участников</th>
                    <th>Призёров</th>
                    <th>Победителей</th>
                    <th>Дипломов</th> -->
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                    <tr>
                        <td>{{ row[0] }}</td>
                        <td>{{ row[1] }}</td>
                        <td>{{ row[2] }}</td>
                    </tr>
                {% else %}
                    <tr><td colspan="7">Строк пока нет.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
