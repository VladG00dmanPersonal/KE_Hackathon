<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                Заголовок карточки
            </div>
            <div class="card-body">
                <h5 class="card-title">Специальный заголовок</h5>
                <p class="card-text">Это пример компонента Bootstrap.</p>
                <a href="#" class="btn btn-success">Кнопка действия</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (нужен для интерактивных элементов, например, модальных окон) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
