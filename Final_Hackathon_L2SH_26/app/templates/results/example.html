{% extends "base.html" %}
{% block title %}Пример формы{% endblock %}
{% block content %}
<section class="section">
    
    <div class="section-head">
        <div>
            <p class="eyebrow">Форма</p>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data" class="form-card wide-form">
        <a class="button secondary" href="{{ url_for('table_region.index') }}">Москва</a>
        <a class="button secondary" href="{{ url_for('table_region.index2') }}">Питер</a>
        <a class="button secondary" href="{{ url_for('table_region.index3') }}">Остальные регионы</a>

        <fieldset class="choice-fieldset">
            <legend>Вариант из списка</legend>
            <label class="check-line"><input type="radio" name="option_value2" value="first" checked> Первый тур </label>
            <label class="check-line"><input type="radio" name="option_value2" value="second"> Второй тур </label>
            <label class="check-line"><input type="radio" name="option_value2" value="both"> Оба тура </label>
        </fieldset>

        <fieldset class="choice-fieldset">
            <legend>Класс участника</legend>
            <label class="check-line"><input type="radio" name="option_value" value="all" checked> Все участники</label>
            <label class="check-line"><input type="radio" name="option_value" value="only_11"> 11 класс</label>
            <label class="check-line"><input type="radio" name="option_value" value="only_10"> 10 класс</label>
            <label class="check-line"><input type="radio" name="option_value" value="only_9"> 9 класс</label>
            <label class="check-line"><input type="radio" name="option_value" value="10_and_lower"> 10 класс и младше</label>
            <label class="check-line"><input type="radio" name="option_value" value="9_and_lower"> 9 класс и младше</label>
            <label class="check-line"><input type="radio" name="option_value" value="8_and_lower"> 8 класс и младше</label>
        </fieldset>

        <fieldset class="choice-fieldset">
            <legend> Регион </legend>
            <label class="check-line"><input type="radio" name="option_value3" value="Москва" checked>Москва</label>
            {% for tag in tags[1:] %}
                <label class="check-line"><input type="radio" name="option_value3" value="{{ tag.name }}">{{ tag.name }}</label>
            {% endfor %}
        </fieldset>
        <button type="submit">Просмотреть результат</button>
    </form>
</section>
{% endblock %}
